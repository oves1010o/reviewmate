<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>충전 처리중 — 리뷰메이트</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--green:#03C75A;--green-dark:#02a84c;--green-light:#e8fff2;--ink:#111;--muted:#888;--border:#e5e5e0;--bg:#f7f8f5;--card:#fff;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;}
.card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:3rem 2.5rem;text-align:center;max-width:400px;width:100%;}
.icon{font-size:3rem;margin-bottom:1rem;}
.title{font-family:'Noto Serif KR',serif;font-size:1.3rem;font-weight:700;margin-bottom:.6rem;}
.desc{font-size:.88rem;color:var(--muted);line-height:1.6;margin-bottom:1.6rem;}
.btn{display:inline-block;padding:12px 28px;border-radius:10px;background:var(--green);color:#fff;text-decoration:none;font-weight:700;font-size:.9rem;}
.btn:hover{background:var(--green-dark);}
.spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--green);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 1.2rem;}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="card" id="card">
  <div class="spinner"></div>
  <div class="title">결제 확인 중입니다...</div>
  <div class="desc">잠시만 기다려주세요.</div>
</div>

<script>
(async () => {
  const params = new URLSearchParams(location.search);
  const paymentKey = params.get('paymentKey');
  const orderId = params.get('orderId');
  const amount = params.get('amount');
  const card = document.getElementById('card');

  if (!paymentKey || !orderId || !amount) {
    card.innerHTML = `
      <div class="icon">⚠️</div>
      <div class="title">결제 정보를 확인할 수 없습니다</div>
      <div class="desc">결제 정보가 누락되었습니다. 대시보드로 돌아가 다시 시도해주세요.</div>
      <a class="btn" href="dashboard.html">대시보드로 돌아가기</a>`;
    return;
  }

  try {
    const res = await fetch('/api/charge/confirm', {
      method: 'POST', credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ paymentKey, orderId, amount: parseInt(amount) })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || '충전 승인 실패');

    sessionStorage.removeItem('pendingCharge');
    card.innerHTML = `
      <div class="icon">🎉</div>
      <div class="title">토큰 충전 완료!</div>
      <div class="desc">토큰 ${data.added}개가 지급되었습니다.<br>현재 보유 토큰: <b>${data.tokens}개</b></div>
      <a class="btn" href="dashboard.html">대시보드로 돌아가기</a>`;
  } catch (e) {
    card.innerHTML = `
      <div class="icon">❌</div>
      <div class="title">충전 승인 중 오류가 발생했습니다</div>
      <div class="desc">${e.message}<br>결제가 되었는데도 이 화면이 보인다면 고객센터로 문의해주세요.</div>
      <a class="btn" href="dashboard.html">대시보드로 돌아가기</a>`;
  }
})();
</script>
</body>
</html>
