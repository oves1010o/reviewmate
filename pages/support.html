<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>고객 문의 — 리뷰메이트</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap');

  :root {
    --green: #00c473;
    --green-dark: #00a85e;
    --bg: #f8faf9;
    --card: #ffffff;
    --text: #1a1a1a;
    --muted: #888;
    --border: #e8ede9;
    --user-bubble: #00c473;
    --ai-bubble: #f0f7f3;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--bg);
    height: 100dvh;
    display: flex;
    flex-direction: column;
  }

  /* 헤더 */
  .header {
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 14px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }

  .header-icon {
    width: 40px;
    height: 40px;
    background: linear-gradient(135deg, var(--green), var(--green-dark));
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.2rem;
  }

  .header-info h2 {
    font-size: .95rem;
    font-weight: 700;
    color: var(--text);
  }

  .header-info p {
    font-size: .75rem;
    color: var(--muted);
  }

  .online-dot {
    width: 8px;
    height: 8px;
    background: var(--green);
    border-radius: 50%;
    margin-left: auto;
    box-shadow: 0 0 0 3px rgba(0,196,115,.15);
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 3px rgba(0,196,115,.15); }
    50% { box-shadow: 0 0 0 6px rgba(0,196,115,.05); }
  }

  /* 채팅 영역 */
  .chat-area {
    flex: 1;
    overflow-y: auto;
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  /* 환영 메시지 */
  .welcome-card {
    background: linear-gradient(135deg, #e8f8f0, #f0fdf6);
    border: 1px solid #c3ecd6;
    border-radius: 16px;
    padding: 20px;
    text-align: center;
    margin-bottom: 8px;
  }

  .welcome-card .emoji { font-size: 2rem; margin-bottom: 8px; }
  .welcome-card h3 { font-size: .95rem; font-weight: 700; color: var(--text); margin-bottom: 6px; }
  .welcome-card p { font-size: .8rem; color: var(--muted); line-height: 1.5; }

  /* 빠른 질문 버튼 */
  .quick-btns {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 4px;
  }

  .quick-btn {
    background: white;
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 7px 14px;
    font-size: .78rem;
    color: var(--text);
    cursor: pointer;
    transition: all .2s;
    font-family: inherit;
  }

  .quick-btn:hover {
    border-color: var(--green);
    color: var(--green);
    background: #f0fdf6;
  }

  /* 메시지 버블 */
  .msg {
    display: flex;
    gap: 8px;
    align-items: flex-end;
    animation: fadeIn .3s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg.user { flex-direction: row-reverse; }

  .avatar {
    width: 32px;
    height: 32px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: .85rem;
    flex-shrink: 0;
  }

  .avatar.ai {
    background: linear-gradient(135deg, var(--green), var(--green-dark));
  }

  .avatar.user-av {
    background: #e8e8e8;
  }

  .bubble {
    max-width: 75%;
    padding: 11px 15px;
    border-radius: 16px;
    font-size: .85rem;
    line-height: 1.6;
  }

  .bubble.ai {
    background: var(--ai-bubble);
    border: 1px solid #dceee3;
    border-bottom-left-radius: 4px;
    color: var(--text);
  }

  .bubble.user {
    background: var(--green);
    color: white;
    border-bottom-right-radius: 4px;
  }

  .msg-time {
    font-size: .68rem;
    color: var(--muted);
    margin-top: 4px;
    text-align: right;
  }

  .msg.user .msg-time { text-align: left; }

  /* 타이핑 인디케이터 */
  .typing {
    display: flex;
    gap: 4px;
    padding: 11px 15px;
    background: var(--ai-bubble);
    border: 1px solid #dceee3;
    border-radius: 16px;
    border-bottom-left-radius: 4px;
    width: fit-content;
  }

  .typing span {
    width: 7px;
    height: 7px;
    background: var(--green);
    border-radius: 50%;
    animation: typing 1.2s infinite;
  }

  .typing span:nth-child(2) { animation-delay: .2s; }
  .typing span:nth-child(3) { animation-delay: .4s; }

  @keyframes typing {
    0%, 60%, 100% { transform: translateY(0); opacity: .4; }
    30% { transform: translateY(-6px); opacity: 1; }
  }

  /* 입력 영역 */
  .input-area {
    background: var(--card);
    border-top: 1px solid var(--border);
    padding: 12px 16px;
    flex-shrink: 0;
  }

  .input-row {
    display: flex;
    gap: 8px;
    align-items: flex-end;
  }

  .input-box {
    flex: 1;
    background: var(--bg);
    border: 1.5px solid var(--border);
    border-radius: 14px;
    padding: 10px 14px;
    font-size: .85rem;
    font-family: inherit;
    resize: none;
    outline: none;
    max-height: 100px;
    transition: border-color .2s;
    line-height: 1.5;
  }

  .input-box:focus { border-color: var(--green); }

  .send-btn {
    width: 42px;
    height: 42px;
    background: var(--green);
    border: none;
    border-radius: 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.1rem;
    transition: all .2s;
    flex-shrink: 0;
  }

  .send-btn:hover { background: var(--green-dark); transform: scale(1.05); }
  .send-btn:disabled { background: #ccc; cursor: not-allowed; transform: none; }

  .input-hint {
    font-size: .7rem;
    color: var(--muted);
    margin-top: 6px;
    text-align: center;
  }

  /* 스토어 배지 */
  .store-badge {
    background: #f0fdf6;
    border: 1px solid #c3ecd6;
    border-radius: 8px;
    padding: 8px 12px;
    font-size: .75rem;
    color: #2d7a4f;
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 12px;
  }
</style>
</head>
<body>

<!-- 헤더 -->
<div class="header">
  <div class="header-icon">🛎️</div>
  <div class="header-info">
    <h2 id="storeName">고객 서비스</h2>
    <p>AI 고객 지원 · 24시간 운영</p>
  </div>
  <div class="online-dot"></div>
</div>

<!-- 채팅 영역 -->
<div class="chat-area" id="chatArea">

  <!-- 환영 메시지 -->
  <div class="welcome-card">
    <div class="emoji">👋</div>
    <h3>안녕하세요! 무엇을 도와드릴까요?</h3>
    <p>결제, 주문, 예약 관련 문의를 남겨주시면<br>빠르게 도움을 드리겠습니다.</p>
  </div>

  <!-- 빠른 질문 버튼 -->
  <div class="quick-btns" id="quickBtns">
    <button class="quick-btn" onclick="sendQuick('결제가 완료되었는데 확인이 안 돼요')">💳 결제 확인</button>
    <button class="quick-btn" onclick="sendQuick('예약을 취소하고 싶어요')">📅 예약 취소</button>
    <button class="quick-btn" onclick="sendQuick('환불 받고 싶어요')">💰 환불 문의</button>
    <button class="quick-btn" onclick="sendQuick('영업시간이 언제인가요?')">🕐 영업시간</button>
    <button class="quick-btn" onclick="sendQuick('주차 가능한가요?')">🚗 주차 안내</button>
  </div>

</div>

<!-- 입력 영역 -->
<div class="input-area">
  <div class="input-row">
    <textarea
      class="input-box"
      id="msgInput"
      placeholder="문의 내용을 입력하세요..."
      rows="1"
      onkeydown="handleKey(event)"
      oninput="autoResize(this)"
    ></textarea>
    <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
  </div>
  <p class="input-hint">Enter로 전송 · Shift+Enter로 줄바꿈</p>
</div>

<script>
  const API = '/api';
  let storeInfo = null;
  let isTyping = false;

  // URL에서 placeId 가져오기
  const params = new URLSearchParams(window.location.search);
  const placeId = params.get('place') || '';

  // 가게 정보 로드
  async function loadStoreInfo() {
    if (!placeId) return;
    try {
      const res = await fetch(`${API}/cs-info/${placeId}`);
      if (res.ok) {
        storeInfo = await res.json();
        document.getElementById('storeName').textContent = storeInfo.storeName + ' 고객센터';
        document.title = storeInfo.storeName + ' — 고객 문의';

        // 스토어 배지 추가
        const badge = document.createElement('div');
        badge.className = 'store-badge';
        badge.innerHTML = `🏪 <strong>${storeInfo.storeName}</strong> 공식 고객 지원`;
        document.getElementById('chatArea').insertBefore(badge, document.getElementById('quickBtns'));
      }
    } catch(e) {}
  }

  // 시간 포맷
  function getTime() {
    return new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
  }

  // 메시지 추가
  function addMessage(text, isUser) {
    const chatArea = document.getElementById('chatArea');

    const wrapper = document.createElement('div');
    wrapper.innerHTML = `
      <div class="msg ${isUser ? 'user' : ''}">
        <div class="avatar ${isUser ? 'user-av' : 'ai'}">${isUser ? '😊' : '🤖'}</div>
        <div>
          <div class="bubble ${isUser ? 'user' : 'ai'}">${text.replace(/\n/g, '<br>')}</div>
          <div class="msg-time">${getTime()}</div>
        </div>
      </div>
    `;

    chatArea.appendChild(wrapper.firstElementChild);
    chatArea.scrollTop = chatArea.scrollHeight;
  }

  // 타이핑 인디케이터
  function showTyping() {
    const chatArea = document.getElementById('chatArea');
    const div = document.createElement('div');
    div.id = 'typingIndicator';
    div.className = 'msg';
    div.innerHTML = `
      <div class="avatar ai">🤖</div>
      <div class="typing"><span></span><span></span><span></span></div>
    `;
    chatArea.appendChild(div);
    chatArea.scrollTop = chatArea.scrollHeight;
    isTyping = true;
  }

  function hideTyping() {
    const el = document.getElementById('typingIndicator');
    if (el) el.remove();
    isTyping = false;
  }

  // 메시지 전송
  async function sendMessage() {
    const input = document.getElementById('msgInput');
    const text = input.value.trim();
    if (!text || isTyping) return;

    input.value = '';
    autoResize(input);
    document.getElementById('sendBtn').disabled = true;

    // 빠른 질문 버튼 숨기기
    const quickBtns = document.getElementById('quickBtns');
    if (quickBtns) quickBtns.style.display = 'none';

    addMessage(text, true);
    showTyping();

    try {
      const res = await fetch(`${API}/cs-chat`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, storeInfo })
      });
      const data = await res.json();
      hideTyping();
      addMessage(data.reply || '죄송합니다. 잠시 후 다시 시도해주세요.', false);
    } catch(e) {
      hideTyping();
      addMessage('일시적인 오류가 발생했습니다. 잠시 후 다시 시도해주세요.', false);
    }

    document.getElementById('sendBtn').disabled = false;
  }

  function sendQuick(text) {
    document.getElementById('msgInput').value = text;
    sendMessage();
  }

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  }

  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 100) + 'px';
  }

  // 초기화
  loadStoreInfo();
</script>
</body>
</html>
